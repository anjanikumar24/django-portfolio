{% if statistics %}
<section class="stats-strip">
  <div class="container">
    <div class="row g-3">
      {% for stat in statistics %}
      <div class="col-6 col-lg-3 reveal">
        <div class="stat-card">
          <strong class="counter" data-target="{{ stat.value }}">0</strong><span>{{ stat.suffix }}</span>
          <p>{{ stat.label }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
